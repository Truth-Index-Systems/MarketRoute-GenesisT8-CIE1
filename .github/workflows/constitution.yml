name: Constitutional Gate

on:
  push:
  pull_request:

jobs:
  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/validate-aws-v0-build7-ai-boundary.mjs
      - run: node tests/adversarial/aws-v0-build7-ai-boundary.mjs
      - run: node scripts/validate-aws-v0-build7-bedrock-runtime.mjs
      - run: node scripts/validate-aws-v0-build7-telemetry.mjs
      - run: node tests/adversarial/aws-v0-build7-telemetry.mjs
      - run: node scripts/validate-aws-v0-build7-bedrock-iam.mjs
      - run: node tests/adversarial/aws-v0-build7-bedrock-iam.mjs
      - run: node scripts/validate-aws-v0-build7-shadow-ai.mjs
      - run: node tests/adversarial/aws-v0-build7-shadow-ai.mjs
      - run: npm run constitution:check
      - run: npm run typecheck
      - run: npm run build
