name: AWS V0 Infrastructure

on:
  pull_request:
    paths:
      - "infrastructure/aws-v0/**"
      - "database/aws/**"
      - ".github/workflows/aws-v0-infrastructure.yml"
  push:
    branches:
      - aws-v0
    paths:
      - "infrastructure/aws-v0/**"
      - "database/aws/**"
      - ".github/workflows/aws-v0-infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_V0_GITHUB_SUBJECT: "repo:Truth-Index-Systems@254102504/MarketRoute-GenesisT8-CIE1@1333375217:ref:refs/heads/aws-v0"
  AWS_V0_AURORA_ENGINE_VERSION: "16.8"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install AWS V0 IaC dependencies
        working-directory: infrastructure/aws-v0
        run: npm install --no-audit --no-fund
      - name: Validate Build 2 synthesis
        working-directory: infrastructure/aws-v0
        run: npm run check
      - name: Validate live OIDC identity synthesis
        working-directory: infrastructure/aws-v0
        run: |
          npm run build
          npx cdk synth --quiet -c githubSubject="$AWS_V0_GITHUB_SUBJECT"
          npm run validate:synth

  deploy:
    # Explicit safety latch: validation always runs, but AWS deployment is disabled
    # until both repository variables are intentionally present.
    if: github.ref == 'refs/heads/aws-v0' && vars.AWS_V0_DEPLOY_ROLE_ARN != '' && vars.AWS_V0_AUTODEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install AWS V0 IaC dependencies
        working-directory: infrastructure/aws-v0
        run: npm install --no-audit --no-fund
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_V0_DEPLOY_ROLE_ARN }}
          role-session-name: MarketRouteAwsV0-${{ github.run_id }}
          aws-region: eu-west-2
          allowed-account-ids: "801132668416"
      - name: Confirm AWS caller
        run: aws sts get-caller-identity
      - name: Confirm Aurora PostgreSQL serverless engine availability
        run: |
          set -euo pipefail
          aws rds describe-orderable-db-instance-options \
            --engine aurora-postgresql \
            --db-instance-class db.serverless \
            --region eu-west-2 \
            --query "OrderableDBInstanceOptions[?EngineVersion=='${AWS_V0_AURORA_ENGINE_VERSION}'].EngineVersion" \
            --output text | tr '\t' '\n' | grep -Fxq "$AWS_V0_AURORA_ENGINE_VERSION"
      - name: Deploy Build 2 database stack only
        working-directory: infrastructure/aws-v0
        run: npm run deploy:database -- -c githubSubject="$AWS_V0_GITHUB_SUBJECT"
