name: AWS V0 Build 3 Schema Audit

on:
  workflow_dispatch:
  push:
    branches:
      - aws-v0
    paths:
      - 'database/aws/**'
      - 'supabase/migrations/**'
      - '.github/workflows/aws-v0-build3-schema-audit.yml'

permissions:
  contents: read

concurrency:
  group: aws-v0-build3-schema-audit
  cancel-in-progress: false

jobs:
  schema-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical aws-v0 branch
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check Build 3 compiler and disposition tooling
        run: |
          node --check database/aws/compile-canonical-baseline.mjs
          node --check database/aws/test-compiler-hardening.mjs
          node --check database/aws/apply-build3-dispositions.mjs
          node --check database/aws/test-build3-dispositions.mjs

      - name: Prove compiler hardening invariants
        run: node database/aws/test-compiler-hardening.mjs

      - name: Prove disposition invariants
        run: node database/aws/test-build3-dispositions.mjs

      - name: Run Build 3 hardened audit
        run: node database/aws/compile-canonical-baseline.mjs

      - name: Apply Build 3 canonical dispositions
        run: node database/aws/apply-build3-dispositions.mjs

      - name: Validate generated audit and manifests
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('database/aws/build3_schema_audit.json', 'utf8'));
          const schemaManifest = JSON.parse(fs.readFileSync('database/aws/0001_marketroute_aws_schema_manifest.json', 'utf8'));
          const disposition = JSON.parse(fs.readFileSync('database/aws/build3_disposition_audit.json', 'utf8'));
          const dispositionManifest = JSON.parse(fs.readFileSync('database/aws/0001_marketroute_aws_disposition_manifest.json', 'utf8'));

          if (audit.build !== 'AWS-V0-BUILD-3') throw new Error('unexpected audit build');
          if (audit.format_version !== 2 || audit.mode !== 'hardened-audit') throw new Error('hardened audit v2 required');
          if (!Number.isInteger(audit.migration_count) || audit.migration_count < 1) throw new Error('no migrations inventoried');
          if (schemaManifest.build !== 'AWS-V0-BUILD-3' || schemaManifest.format_version !== 2) throw new Error('unexpected schema manifest format');
          if (schemaManifest.prohibited_historical_data_import !== true) throw new Error('historical data prohibition missing');
          if (!schemaManifest.excluded_migrations.includes('0019_v1_evidence_migration.sql')) throw new Error('V1 ETL exclusion missing');

          const v1 = schemaManifest.source_migrations.find((m) => m.file === '0019_v1_evidence_migration.sql');
          if (!v1 || v1.canonical_candidate !== false || v1.disposition !== 'EXCLUDE_V1_ETL') {
            throw new Error('V1 ETL is not structurally excluded from canonical candidates');
          }
          if (audit.final_object_candidates.some((o) => o.final_source?.file === '0019_v1_evidence_migration.sql')) {
            throw new Error('V1 ETL object leaked into canonical candidate set');
          }

          if (disposition.build !== 'AWS-V0-BUILD-3' || disposition.mode !== 'canonical-disposition') throw new Error('unexpected disposition audit');
          if (disposition.raw_unresolved_count !== audit.unresolved_count) throw new Error('disposition input does not match hardened unresolved set');
          if (disposition.resolved_decisions + disposition.unresolved_count !== disposition.raw_unresolved_count) throw new Error('disposition accounting mismatch');
          if (dispositionManifest.prohibited_historical_data_import !== true) throw new Error('disposition historical-data prohibition missing');

          const identity = dispositionManifest.identity_boundary;
          if (identity?.version !== 'AWS-V0-INTERNAL-IDENTITY-1') throw new Error('AWS internal identity boundary missing');
          if (identity.internal_user_relation !== 'public.marketroute_users') throw new Error('internal user relation mismatch');
          if (identity.database_actor_contract !== 'EXPLICIT_INTERNAL_USER_UUID') throw new Error('explicit actor UUID contract missing');
          if (identity.trusted_backend_contract !== 'SERVER_SIDE_DATA_API_ONLY') throw new Error('trusted backend contract missing');
          if (identity.browser_database_access !== false || identity.supabase_auth_schema_allowed !== false || identity.supabase_roles_allowed !== false || identity.request_jwt_session_state_allowed !== false) {
            throw new Error('Supabase/browser identity dependency leaked into AWS boundary');
          }

          const expectedStatus = disposition.unresolved_count === 0 ? 'READY_FOR_FINAL_OBJECT_RESOLUTION' : 'DISPOSITION_REVIEW_REQUIRED';
          if (dispositionManifest.status !== expectedStatus) throw new Error('disposition manifest status mismatch');

          console.log(JSON.stringify({
            migration_count: audit.migration_count,
            migration_range: audit.migration_range,
            hardened_unresolved: audit.unresolved_count,
            hardened_blockers: audit.blockers.length,
            hardened_review_items: audit.review_items.length,
            hardened_resolved_exclusions: audit.resolved_exclusions.length,
            object_candidates: audit.final_object_candidates.length,
            disposition_resolved: disposition.resolved_decisions,
            disposition_unresolved: disposition.unresolved_count,
            required_transforms: disposition.required_transforms,
            disposition_exclusions: disposition.resolved_exclusions,
            disposition_counts: disposition.disposition_counts,
            identity_boundary: identity.version,
            manifest_status: dispositionManifest.status,
          }, null, 2));
          NODE

      - name: Prove baseline emission remains fail closed
        shell: bash
        run: |
          rm -f database/aws/0001_marketroute_aws_canonical_baseline.sql
          set +e
          node database/aws/compile-canonical-baseline.mjs --emit-baseline
          status=$?
          set -e
          if [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then
            echo "Expected fail-closed exit 2 or 3, received $status" >&2
            exit 1
          fi
          if [ -e database/aws/0001_marketroute_aws_canonical_baseline.sql ]; then
            echo "Compiler emitted baseline before the Build 3 gate cleared" >&2
            exit 1
          fi
          echo "Fail-closed baseline gate verified with exit $status."

      - name: Upload Build 3 audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aws-v0-build3-schema-audit
          path: |
            database/aws/build3_schema_audit.json
            database/aws/0001_marketroute_aws_schema_manifest.json
            database/aws/build3_disposition_audit.json
            database/aws/0001_marketroute_aws_disposition_manifest.json
          if-no-files-found: error
          retention-days: 14
